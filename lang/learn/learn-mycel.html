<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learn Mycel from Zero — Complete Beginner Course</title>
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --panel-hover: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-bg: rgba(88, 166, 255, 0.15);
  --ok: #3fb950;
  --ok-bg: rgba(63, 185, 80, 0.15);
  --bad: #f85149;
  --bad-bg: rgba(248, 81, 73, 0.15);
  --code-bg: #010409;
  --quote-bg: #1c2128;
}

[data-theme="light"] {
  --bg: #ffffff;
  --panel: #f6f8fa;
  --panel-hover: #eaeef2;
  --border: #d0d7de;
  --text: #1f2328;
  --muted: #656d76;
  --accent: #0969da;
  --accent-bg: rgba(9, 105, 218, 0.12);
  --ok: #1a7f37;
  --ok-bg: rgba(26, 127, 55, 0.12);
  --bad: #cf222e;
  --bad-bg: rgba(207, 34, 46, 0.12);
  --code-bg: #f6f8fa;
  --quote-bg: #f3f4f6;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  display: flex;
  min-height: 100vh;
}

nav {
  width: 300px;
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 20px 16px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex: none;
  display: flex;
  flex-direction: column;
}

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 6px;
}
.brand h1 {
  font-size: 19px;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}
.theme-btn {
  background: none;
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 13px;
  cursor: pointer;
}
.brand-sub {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 14px;
}

.bar-box {
  margin: 10px 0 16px;
}
.bar-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 4px;
}
.bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--ok);
  border-radius: 3px;
  width: 0%;
  transition: width 0.3s ease;
}

#list {
  flex: 1;
  overflow-y: auto;
  margin-right: -4px;
  padding-right: 4px;
}
#list a {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--text);
  cursor: pointer;
  font-size: 14px;
  text-decoration: none;
  margin-bottom: 2px;
  transition: background 0.15s;
}
#list a:hover {
  background: var(--panel-hover);
}
#list a.cur {
  background: var(--accent-bg);
  color: var(--accent);
  font-weight: 600;
}
#list a .k {
  width: 16px;
  color: var(--ok);
  font-weight: bold;
  flex: none;
  text-align: center;
}

.nav-foot {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.nav-foot button {
  background: none;
  border: 1px solid var(--border);
  color: var(--muted);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
}
.nav-foot button:hover {
  color: var(--text);
  border-color: var(--text);
}

main {
  flex: 1;
  max-width: 840px;
  padding: 36px 44px;
  margin: 0 auto;
}

h2 {
  font-size: 26px;
  margin-top: 0;
  margin-bottom: 8px;
  letter-spacing: -0.02em;
}
.lead {
  font-size: 17px;
  color: var(--text);
  margin-bottom: 20px;
}
p {
  margin: 14px 0;
  line-height: 1.68;
}

code {
  background: rgba(110, 118, 129, 0.2);
  padding: 2px 6px;
  border-radius: 4px;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 0.9em;
}

pre {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  font: 14px/1.55 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  margin: 12px 0;
}

pre.out {
  border-left: 4px solid var(--ok);
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}

.lbl {
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 20px 0 6px;
}

.smp {
  margin: 20px 0;
}

.code {
  background: var(--code-bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 0;
  font: 14px/1.55 ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  overflow-x: auto;
}

.ln {
  display: flex;
  padding: 2px 14px;
  white-space: pre;
  cursor: default;
}
.ln.x {
  cursor: pointer;
}
.ln.x:hover {
  background: var(--accent-bg);
}
.ln.sel {
  background: var(--accent-bg);
  border-left: 3px solid var(--accent);
  padding-left: 11px;
}
.ln b {
  color: var(--muted);
  font-weight: 400;
  width: 34px;
  flex: none;
  user-select: none;
}

.exp {
  margin: 10px 0 16px;
  padding: 12px 16px;
  border-left: 3px solid var(--accent);
  background: var(--panel);
  border-radius: 0 8px 8px 0;
  font-size: 14.5px;
  min-height: 48px;
  color: var(--muted);
}
.exp.on {
  color: var(--text);
}

.quiz {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 22px;
  margin-top: 32px;
}
.quiz-title {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.q {
  margin: 18px 0;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.q:last-child {
  border-bottom: none;
  margin-bottom: 0;
  padding-bottom: 0;
}
.q-text {
  font-weight: 500;
  margin-bottom: 8px;
}
.q button {
  display: block;
  width: 100%;
  text-align: left;
  margin: 6px 0;
  padding: 10px 14px;
  background: var(--panel-hover);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 6px;
  cursor: pointer;
  font: inherit;
  font-size: 14.5px;
  transition: all 0.15s;
}
.q button:hover:not(:disabled) {
  border-color: var(--accent);
  background: var(--accent-bg);
}
.q button.ok {
  border-color: var(--ok);
  background: var(--ok-bg);
  color: var(--ok);
  font-weight: 600;
}
.q button.bad {
  border-color: var(--bad);
  background: var(--bad-bg);
  color: var(--bad);
}
.fb {
  font-size: 13.5px;
  margin-top: 6px;
  min-height: 20px;
}
.fb.ok { color: var(--ok); }
.fb.bad { color: var(--bad); }

.nav2 {
  display: flex;
  justify-content: space-between;
  margin-top: 36px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}
.nav2 button {
  background: var(--ok);
  color: #fff;
  border: 0;
  border-radius: 6px;
  padding: 10px 20px;
  cursor: pointer;
  font: inherit;
  font-weight: 600;
  transition: opacity 0.15s;
}
.nav2 button:hover:not(:disabled) {
  opacity: 0.9;
}
.nav2 button.g {
  background: var(--panel-hover);
  color: var(--text);
  border: 1px solid var(--border);
}
.nav2 button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

dl { margin: 0; }
dt {
  font-weight: 600;
  margin-top: 16px;
  color: var(--accent);
  font-size: 16px;
}
dd {
  margin: 4px 0 0;
  color: var(--text);
}

@media(max-width: 768px) {
  body { flex-direction: column; }
  nav {
    width: 100%;
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--border);
    padding: 16px;
  }
  main {
    padding: 24px 16px;
  }
  #list {
    max-height: 220px;
  }
}
</style>
</head>
<body>
<nav>
  <div class="brand">
    <h1>Learn Mycel</h1>
    <button class="theme-btn" id="theme-toggle" title="Toggle theme">🌓 Theme</button>
  </div>
  <div class="brand-sub">The beginner-first language · <code>.myc</code></div>
  <div class="bar-box">
    <div class="bar-label"><span>Progress</span><span id="prog-pct">0%</span></div>
    <div class="bar"><i id="bar"></i></div>
  </div>
  <div id="list"></div>
  <div class="nav-foot">
    <span id="prog-count" style="font-size:12px;color:var(--muted)">0 / 16 done</span>
    <button id="reset">Reset</button>
  </div>
</nav>

<main id="main"></main>

<script>
const DATA = {"L":[{"title":"What is a program?","desc":"A <b>program</b> is a list of instructions for a computer, like a recipe is a list of instructions for a cook. The computer follows them one at a time, top to bottom, and does exactly what they say. In Mycel, there is zero boilerplate: no <code>class Main</code>, no <code>public static void main</code> — you just write instructions directly!","blocks":[["p","The instructions are written in <b>Mycel</b> (named after the fungal network that connects a living forest). Files end in <code>.myc</code> (and <code>.olx</code> is also accepted)."],["p","<b>Running</b> a program means telling the computer: “follow this file now.” You do that in your terminal by typing:"],["pre","mycel run hello.myc"],["p","<code>mycel</code> is the command that understands the language. <code>run</code> means “execute the file”. Click any line in the code box below to see what each part means, followed by the real output from running the program!"],["s",{"f":"01_hello","code":"// Your very first Mycel program!\nprint(\"Hello, Mycel!\")\nprint(\"Welcome to programming.\")","out":"Hello, Mycel!\nWelcome to programming.","ex":{"1":"A <b>comment</b>. Two slashes <code>//</code> mean “ignore the rest of this line.” It is a note for humans.","2":"<code>print(...)</code> shows words on the screen. The round brackets <code>( )</code> hold what to print. The double quotes <code>\" \"</code> mark the start and end of a text string.","3":"A second <code>print</code> command. Instructions run in order from top to bottom."}}]],"quiz":[{"q":"What is a computer program?","o":["A list of instructions a computer follows top to bottom","A type of physical keyboard","A video file"],"a":0,"why":"A program is a sequence of instructions written in code that tells the computer what to do step by step."},{"q":"What does the line <code>// note</code> do?","o":["It is a comment skipped by the computer","It prints 'note' in green","It stops the program"],"a":0,"why":"Comments starting with // are ignored by the compiler and are purely notes for programmers."},{"q":"How do you run a file called <code>app.myc</code>?","o":["mycel run app.myc","mycel app.myc delete","open app.myc"],"a":0,"why":"`mycel run <file>` compiles and executes the file immediately."}]},{"title":"Values and arithmetic","desc":"Every piece of information in a program is a <b>value</b>. Mycel has built-in types for text, whole numbers, decimals, and true/false logic. Doing maths in Mycel is just like maths in school — and unlike older languages, dividing numbers like <code>7 / 2</code> gives <code>3.5</code>!","blocks":[["p","Common value types in Mycel:"],["p","• <code>String</code>: text enclosed in quotes (e.g. <code>\"hello\"</code>)<br>• <code>Int</code>: whole numbers (e.g. <code>42</code>, <code>-5</code>)<br>• <code>Float</code>: decimal numbers (e.g. <code>3.14</code>, <code>0.5</code>)<br>• <code>Bool</code>: boolean logic (<code>true</code> or <code>false</code>)"],["p","Standard math operators are <code>+</code> (add), <code>-</code> (subtract), <code>*</code> (multiply), <code>/</code> (divide), and <code>%</code> (remainder). For integer division, use <code>7.div(2)</code> (giving 3)."],["s",{"f":"02_values","code":"// Different kinds of values\nprint(\"Text string\")\nprint(42)\nprint(3.14)\nprint(true)\n\n// Doing maths\nprint(10 + 5)\nprint(10 - 4)\nprint(6 * 7)\nprint(7 / 2)\nprint(7.div(2))\nprint(7 % 2)","out":"Text string\n42\n3.14\ntrue\n15\n6\n42\n3.5\n3\n1","ex":{"1":"A comment explaining values.","2":"Prints a <code>String</code> (text). Quotes tell the computer this is text, not code.","3":"Prints an <code>Int</code> (whole number). Numbers do not use quotes.","4":"Prints a <code>Float</code> (decimal number with a decimal point).","5":"Prints a <code>Bool</code> (boolean value <code>true</code>).","8":"<code>+</code> adds: 10 + 5 evaluates to 15.","9":"<code>-</code> subtracts: 10 - 4 evaluates to 6.","10":"<code>*</code> multiplies (star stands for ×): 6 * 7 gives 42.","11":"<code>/</code> divides: in Mycel, <code>7 / 2</code> gives <code>3.5</code> decimal just like real life!","12":"<code>.div(2)</code> performs whole-number division: 7 shared by 2 is 3 with fractions dropped.","13":"<code>%</code> is the remainder (modulo): 7 divided by 2 leaves a remainder of 1."}}]],"quiz":[{"q":"In Mycel, what does <code>7 / 2</code> evaluate to?","o":["3.5","3","4"],"a":0,"why":"In Mycel, standard division with `/` always produces the exact Float result (3.5)."},{"q":"Which of these is a Float?","o":["3.14","42","\"42\""],"a":0,"why":"A number with a decimal point is a Float."},{"q":"What does <code>10 % 3</code> give?","o":["1","3","0"],"a":0,"why":"10 divided by 3 is 3 with 1 remainder, so % returns 1."}]},{"title":"Variables with x = 1","desc":"A <b>variable</b> is a named container for a value. In Mycel, declaring a variable is as simple as <code>x = 1</code> — no ceremony or complex type declaration required. The first assignment automatically creates the variable!","blocks":[["p","You can also use <code>let</code> when you want to seal a variable so it can never be changed, or <code>var</code> when you want to signal that a variable's value will change over time."],["p","Update operators like <code>score += 5</code> are shortcuts for <code>score = score + 5</code>."],["s",{"f":"03_variables","code":"// Variables hold values\nname = \"Ada\"\nage = 36\nprint(name)\nprint(age)\n\n// Updating a variable\nscore = 10\nscore += 5\nprint(score)\n\n// You can also seal a value with let, or mark it with var\nlet city = \"London\"\nvar lives = 3\nlives -= 1\nprint(city)\nprint(lives)","out":"Ada\n36\n15\nLondon\n2","ex":{"1":"A comment introducing variables.","2":"Creates a variable named <code>name</code> and stores the text <code>\"Ada\"</code> inside.","3":"Creates variable <code>age</code> storing the whole number 36.","4":"Prints what is inside <code>name</code> (notice no quotes around <code>name</code>).","5":"Prints what is inside <code>age</code>.","8":"Creates variable <code>score</code> starting at 10.","9":"<code>score += 5</code> adds 5 to the existing score, so it becomes 15.","10":"Prints 15.","13":"<code>let</code> creates an immutable sealed variable: <code>city</code> can never be reassigned.","14":"<code>var</code> explicitly declares a variable that will vary.","15":"<code>lives -= 1</code> subtracts 1 from lives.","16":"Prints <code>\"London\"</code>.","17":"Prints 2."}}]],"quiz":[{"q":"How do you create a variable named `count` with value 1 in Mycel?","o":["count = 1","variable count := 1","int count = 1;"],"a":0,"why":"Simple assignment `count = 1` creates the variable directly."},{"q":"What does `score += 5` do?","o":["Adds 5 to the current value of score","Checks if score equals 5","Sets score to 5"],"a":0,"why":"`score += 5` is shorthand for `score = score + 5`."},{"q":"Why would you declare a variable with `let`?","o":["To seal it so its value cannot be accidentally reassigned","To make it a string","To delete it"],"a":0,"why":"`let` creates an immutable binding that prevents accidental changes."}]},{"title":"Formatting text with f-strings","desc":"An <b>f-string</b> lets you embed variables and expressions directly into text. Prefix quotes with <code>f</code>: <code>f\"Hello {name}!\"</code>. Inside curly brackets <code>{ }</code>, Mycel computes the value and inserts it into the string.","blocks":[["p","Inside the braces you can put variables (<code>{name}</code>), calculations (<code>{score + 5}</code>), format specifiers like <code>{ratio:.2f}</code> for 2 decimal places, or debug expressions like <code>{name=}</code> to print both the name and its value."],["s",{"f":"04_fstrings","code":"name = \"Ada\"\nscore = 42\npoints_needed = 8\n\n// Mixing variables into text\nprint(f\"Player {name} has {score} points.\")\n\n// Calculating inside braces\nprint(f\"Next level in {score + points_needed} points.\")\n\n// Number formatting (two decimal places)\nratio = 355.0 / 113.0\nprint(f\"Pi estimate: {ratio:.2f}\")\n\n// Debug print shows the variable name and value\nprint(f\"{name=} {score=}\")","out":"Player Ada has 42 points.\nNext level in 50 points.\nPi estimate: 3.14\nname=\"Ada\" score=42","ex":{"1":"Sets variable <code>name</code> to <code>\"Ada\"</code>.","2":"Sets variable <code>score</code> to 42.","3":"Sets variable <code>points_needed</code> to 8.","6":"An f-string: <code>{name}</code> becomes <code>Ada</code> and <code>{score}</code> becomes <code>42</code>.","9":"Expressions inside braces: <code>{score + points_needed}</code> calculates 42 + 8 = 50.","12":"Calculates a decimal approximation of Pi (355 / 113).","13":"<code>{ratio:.2f}</code> formats the number to exactly 2 decimal places: 3.14.","16":"Debug print: <code>{name=}</code> outputs <code>name=\"Ada\"</code> and <code>{score=}</code> outputs <code>score=42</code>."}}]],"quiz":[{"q":"What letter goes before a string literal to enable interpolation?","o":["f","s","$"],"a":0,"why":"An `f` prefix creates an f-string, like `f\"Hello {name}\"`."},{"q":"If `a = 3` and `b = 4`, what does `f\"{a * b}\"` evaluate to?","o":["12","a * b","{12}"],"a":0,"why":"Expressions inside `{ }` are calculated and converted to text."},{"q":"What does `{value:.2f}` do in an f-string?","o":["Formats the float to 2 decimal places","Multiplies value by 2","Rounds to the nearest whole number"],"a":0,"why":"The `:.2f` format specifier formats a decimal number to two digits after the decimal point."}]},{"title":"Lists and comprehensions","desc":"A <b>list</b> is an ordered collection of values in square brackets <code>[ ]</code>. Items are indexed starting at <code>0</code>. Negative indexes count backwards from the end (<code>items[-1]</code> is the last item).","blocks":[["p","Check membership using <code>in</code> and <code>not in</code>. Add items with <code>.push()</code>."],["p","Transform and filter lists with <b>list comprehensions</b>: <code>[n * 2 for n in numbers if n % 2 == 0]</code> creates a new list in one clean, readable line!"],["s",{"f":"05_lists","code":"fruits = [\"apple\", \"banana\", \"cherry\"]\n\n// First and last item\nprint(fruits[0])\nprint(fruits[-1])\nprint(fruits.length)\n\n// Testing membership\nprint(\"banana\" in fruits)\nprint(\"grape\" not in fruits)\n\n// Adding an item\nfruits.push(\"mango\")\nprint(fruits)\n\n// List comprehension: transform and filter\nnumbers = [1, 2, 3, 4, 5]\nevens_doubled = [n * 2 for n in numbers if n % 2 == 0]\nprint(evens_doubled)","out":"apple\ncherry\n3\ntrue\ntrue\n[\"apple\", \"banana\", \"cherry\", \"mango\"]\n[4, 8]","ex":{"1":"Creates a list of three strings: <code>fruits</code>.","4":"<code>fruits[0]</code> accesses slot 0 (the first item: <code>apple</code>).","5":"<code>fruits[-1]</code> accesses the last item (<code>cherry</code>).","6":"<code>fruits.length</code> returns the number of items (3).","9":"<code>\"banana\" in fruits</code> checks if \"banana\" is in the list: returns <code>true</code>.","10":"<code>\"grape\" not in fruits</code> checks that \"grape\" is absent: returns <code>true</code>.","13":"<code>fruits.push(\"mango\")</code> appends a new item to the end of the list.","14":"Prints the updated list with mango added.","17":"Creates a list of numbers from 1 to 5.","18":"List comprehension: filters for even numbers (<code>n % 2 == 0</code>) and doubles them (<code>n * 2</code>).","19":"Prints the resulting list: <code>[4, 8]</code>."}}]],"quiz":[{"q":"What is the index of the first item in a list?","o":["0","1","-1"],"a":0,"why":"Lists in Mycel are 0-indexed, so the first element is at index 0."},{"q":"How do you access the last item of a list `items`?","o":["items[-1]","items[last]","items.last"],"a":0,"why":"Negative indexing counts from the end: `items[-1]` is the last item."},{"q":"What does `[x * 10 for x in [1, 2]]` produce?","o":["[10, 20]","[1, 2, 10]","20"],"a":0,"why":"The list comprehension takes each item x and multiplies it by 10, producing `[10, 20]`."}]},{"title":"Making choices: if and else","desc":"Programs make choices using <code>if</code>, <code>else if</code>, and <code>else</code>. In Mycel, <code>if</code> is also an <b>expression</b> that returns a value! You can assign the result of an if block directly, or use Python-style inline <code>a if c else b</code>.","blocks":[["p","Conditions can be combined using <code>and</code>, <code>or</code>, and <code>not</code> (or C-style <code>&&</code>, <code>||</code>, <code>!</code>)."],["s",{"f":"06_if_else","code":"score = 85\n\n// Classic if / else if / else\nif score >= 90 {\n  print(\"Grade: A\")\n} else if score >= 80 {\n  print(\"Grade: B\")\n} else {\n  print(\"Keep practicing\")\n}\n\n// if as an expression (returns a value)\nstatus = if score >= 60 { \"passed\" } else { \"needs review\" }\nprint(f\"Status: {status}\")\n\n// Python-style inline if\nlabel = \"adult\" if score >= 18 else \"youth\"\nprint(f\"Label: {label}\")","out":"Grade: B\nStatus: passed\nLabel: adult","ex":{"1":"Sets <code>score</code> to 85.","4":"<code>if score >= 90</code>: condition is false, so it moves to the next branch.","6":"<code>else if score >= 80</code>: 85 >= 80 is true, so this branch runs!","7":"Prints <code>\"Grade: B\"</code>.","8":"<code>else</code> is skipped because a previous branch matched.","13":"<code>if</code> expression: evaluates to <code>\"passed\"</code> or <code>\"needs review\"</code> and stores it in <code>status</code>.","14":"Prints <code>Status: passed</code>.","17":"Inline if: <code>\"adult\" if score >= 18 else \"youth\"</code>.","18":"Prints <code>Label: adult</code>."}}]],"quiz":[{"q":"What keyword is used for additional conditions after an `if`?","o":["else if","elif","otherwise"],"a":0,"why":"Mycel uses `else if` for multi-branch conditionals."},{"q":"Can an `if` block return a value to assign to a variable?","o":["Yes, if is an expression in Mycel","No, if is only a statement","Only inside a loop"],"a":0,"why":"In Mycel, `if condition { valA } else { valB }` is a value expression."},{"q":"If `x = 5`, what is `\"yes\" if x > 10 else \"no\"`?","o":["no","yes","true"],"a":0,"why":"Since x is not greater than 10, the else branch evaluates to 'no'."}]},{"title":"Doing things repeatedly: loops","desc":"A <b>loop</b> repeats a block of instructions without retyping them. Use <code>for item in list</code> to iterate through items, or <code>for i, item in list</code> to get both the index and the item. Ranges like <code>1..=3</code> generate runs of numbers.","blocks":[["p","Use <code>while condition { ... }</code> when you want to repeat something until a condition turns false."],["s",{"f":"07_loops","code":"fruits = [\"apple\", \"pear\", \"plum\"]\n\n// Loop over items with index\nfor i, fruit in fruits {\n  print(f\"{i + 1}. {fruit}\")\n}\n\n// Loop over a range of numbers\nfor n in 1..=3 {\n  print(f\"Count: {n}\")\n}\n\n// while loop\nvar timer = 3\nwhile timer > 0 {\n  print(f\"T-minus {timer}\")\n  timer -= 1\n}\nprint(\"Liftoff!\")","out":"1. apple\n2. pear\n3. plum\nCount: 1\nCount: 2\nCount: 3\nT-minus 3\nT-minus 2\nT-minus 1\nLiftoff!","ex":{"1":"A list of fruit names.","4":"<code>for i, fruit in fruits</code> unpacks both the index <code>i</code> and the item <code>fruit</code>.","5":"Prints each line with 1-based numbering: <code>{i + 1}. {fruit}</code>.","9":"<code>1..=3</code> is an inclusive range containing 1, 2, and 3.","10":"Prints each number in the range.","14":"Declares a mutable <code>timer</code> variable starting at 3.","15":"<code>while timer > 0</code> loops as long as timer is positive.","16":"Prints current countdown.","17":"<code>timer -= 1</code> counts down so the loop can stop.","19":"Runs after the loop completes: <code>Liftoff!</code>."}}]],"quiz":[{"q":"How do you get both the index and value in a loop?","o":["for i, item in list","for item with index","for (i = 0; ...)"],"a":0,"why":"`for i, item in list` cleanly unpacks both the slot number and the element."},{"q":"What numbers are in the range `1..=3`?","o":["1, 2, 3","1, 2","0, 1, 2, 3"],"a":0,"why":"The `..=` operator is an inclusive range, so it includes the end number 3."},{"q":"When does a while loop terminate?","o":["When its condition evaluates to false","After 10 rounds always","When print is called"],"a":0,"why":"A while loop checks its condition before every iteration and stops when it becomes false."}]},{"title":"Functions: reusable recipes","desc":"A <b>function</b> is a named recipe you can call whenever you need it. Declare one with <code>fn name(params) { ... }</code>. Mycel infers parameter types from usage, so you don't need heavy type annotations!","blocks":[["p","For short one-liners, arrow syntax <code>fn double(x) => x * 2</code> is lightning fast to write. Parameters can also have default values, such as <code>greeting = \"Hello\"</code>."],["s",{"f":"08_functions","code":"// A function with untyped parameters and return\nfn add(a, b) {\n  return a + b\n}\n\n// Compact arrow function for one-liners\nfn double(x) => x * 2\n\n// Function with a default parameter\nfn greet(name, greeting = \"Hello\") {\n  return f\"{greeting}, {name}!\"\n}\n\nprint(add(20, 22))\nprint(double(7))\nprint(greet(\"Ada\"))\nprint(greet(\"Bob\", greeting: \"Welcome\"))","out":"42\n14\nHello, Ada!\nWelcome, Bob!","ex":{"2":"Defines function <code>add(a, b)</code> with inferred parameter and return types.","3":"<code>return</code> hands back the calculated sum and exits the function.","7":"A concise arrow function: <code>fn double(x) => x * 2</code>.","10":"Function with a default parameter: <code>greeting = \"Hello\"</code>.","11":"Returns the formatted greeting string.","14":"Calls <code>add(20, 22)</code> and prints 42.","15":"Calls <code>double(7)</code> and prints 14.","16":"Calls <code>greet(\"Ada\")</code> using the default greeting.","17":"Calls <code>greet(\"Bob\", greeting: \"Welcome\")</code> with a custom named argument."}}]],"quiz":[{"q":"What keyword defines a function in Mycel?","o":["fn","def","function"],"a":0,"why":"Mycel uses `fn` to declare functions."},{"q":"What does `fn square(x) => x * x` do?","o":["Defines a one-line function that squares x","Checks if x is square","Draws a square"],"a":0,"why":"The arrow `=>` defines a single-expression function that automatically returns the result."},{"q":"What happens if an argument with a default value is omitted?","o":["The default value is used automatically","An error is thrown","It evaluates to nil"],"a":0,"why":"Default parameters take effect whenever the caller does not pass a value."}]},{"title":"Look-up tables: maps","desc":"A <b>map</b> (or dictionary) stores key-value pairs, like looking up a person's name to find their phone number or score. Created with curly brackets: <code>scores = {\"Ada\": 98, \"Bob\": 75}</code>.","blocks":[["p","An empty map is written as <code>{}</code>. Looking up a missing key returns <code>nil</code> (nothing) rather than crashing, or you can use <code>map.get(key, default)</code> to provide a fallback."],["s",{"f":"09_maps","code":"// A map pairs keys to values\nscores = {\"Ada\": 98, \"Bob\": 75}\n\n// Looking up values\nprint(scores[\"Ada\"])\nprint(scores[\"Unknown\"])\nprint(scores.get(\"Unknown\", 0))\n\n// Adding new keys and updating\nscores[\"Charlie\"] = 82\nscores[\"Bob\"] += 5\n\n// Iterating over key-value pairs\nfor (name, score) in scores {\n  print(f\"{name}: {score}\")\n}","out":"98\nnil\n0\nAda: 98\nBob: 80\nCharlie: 82","ex":{"2":"Creates a map pairing student names to test scores.","5":"Looks up key <code>\"Ada\"</code>: prints 98.","6":"Looks up a key that doesn't exist: prints <code>nil</code>.","7":"<code>.get(\"Unknown\", 0)</code> returns 0 if the key is missing.","10":"Adds a new entry for Charlie with score 82.","11":"Updates Bob's score by adding 5.","14":"<code>for (name, score) in scores</code> loops over every key-value pair.","15":"Prints each student's name and score."}}]],"quiz":[{"q":"How do you write an empty map in Mycel?","o":["{}","{:}","Map()"],"a":0,"why":"In Mycel, an empty map is simply `{}`."},{"q":"What is returned when looking up a key that is not in the map?","o":["nil","An error crash","0"],"a":0,"why":"Accessing a missing key returns `nil` safely without crashing."},{"q":"What does `map.get(\"age\", 18)` do if \"age\" is missing?","o":["Returns the fallback value 18","Returns nil","Inserts 18 into the map"],"a":0,"why":"`.get(key, default)` returns the default value if the key does not exist."}]},{"title":"Unique collections: sets","desc":"A <b>Set</b> is a collection of unique values where duplicate items are automatically removed. Create one with <code>Set([1, 2, 3])</code>.","blocks":[["p","Sets support fast membership checks with <code>in</code> and set mathematics:"],["p","• <code>|</code>: Union (all items in either set)<br>• <code>&</code>: Intersection (only items in both sets)<br>• <code>-</code>: Difference (items in the first set but not the second)"],["s",{"f":"10_sets","code":"// Sets hold unique values (duplicates are dropped)\nfrontend = Set([\"HTML\", \"CSS\", \"JavaScript\"])\nbackend = Set([\"Python\", \"JavaScript\", \"Mycel\"])\n\n// Membership test\nprint(\"Mycel\" in backend)\nprint(\"Rust\" in backend)\n\n// Set operations: union, intersection, difference\nboth = frontend & backend\nall_skills = frontend | backend\nfront_only = frontend - backend\n\nprint(f\"Both: {both}\")\nprint(f\"All skills: {all_skills}\")\nprint(f\"Front only: {front_only}\")","out":"true\nfalse\nBoth: #[\"JavaScript\"]\nAll skills: #[\"HTML\", \"CSS\", \"JavaScript\", \"Python\", \"Mycel\"]\nFront only: #[\"HTML\", \"CSS\"]","ex":{"2":"Creates a Set of frontend technologies.","3":"Creates a Set of backend technologies.","6":"Checks if <code>\"Mycel\"</code> is in <code>backend</code>: prints <code>true</code>.","7":"Checks if <code>\"Rust\"</code> is in <code>backend</code>: prints <code>false</code>.","10":"<code>&</code> (intersection) finds items in both sets: <code>#[\"JavaScript\"]</code>.","11":"<code>|</code> (union) combines all unique items across both sets.","12":"<code>-</code> (difference) takes frontend skills that are not in backend.","14":"Prints intersection.","15":"Prints union.","16":"Prints difference."}}]],"quiz":[{"q":"What happens when you put duplicate items into a Set?","o":["Duplicates are discarded so only unique items remain","An error occurs","The items are numbered"],"a":0,"why":"A Set only keeps unique items; duplicates are automatically discarded."},{"q":"Which operator computes the intersection (common items) of two sets?","o":["&","|","-"],"a":0,"why":"The `&` operator computes set intersection."},{"q":"How is a set literal constructed?","o":["Set([1, 2, 3])","#[1, 2, 3]","{1, 2, 3}"],"a":0,"why":"`Set([1, 2, 3])` is the idiomatic constructor for sets."}]},{"title":"Structs and classes","desc":"As programs grow, you group related data and behaviours together using structs and classes.","blocks":[["p","• <b>struct</b>: An immutable data container (like a Point or Contact Card). Two structs with identical values are equal (<code>==</code>), and <code>.with()</code> makes modified copies."],["p","• <b>class</b>: A blueprint for stateful objects that hold properties and have <b>methods</b> (functions attached to the object). Inside a class, <code>self</code> refers to the active instance."],["s",{"f":"11_classes","code":"// A struct is an immutable value form\nstruct Point { let x: Int, y: Int }\n\np1 = Point(x: 10, y: 20)\np2 = p1.with(y: 50)\nprint(f\"p1=({p1.x}, {p1.y}) p2=({p2.x}, {p2.y})\")\nprint(p1 == Point(x: 10, y: 20))\n\n// A class is a blueprint for objects with behaviour\nclass Hero {\n  let name: String\n  var health: Int = 100\n\n  init(name: String) {\n    self.name = name\n  }\n\n  fn takeDamage(amount: Int) {\n    self.health -= amount\n  }\n\n  fn status() -> String {\n    return f\"{self.name} has {self.health} HP\"\n  }\n}\n\nhero = Hero(name: \"Aria\")\nprint(hero.status())\nhero.takeDamage(25)\nprint(hero.status())","out":"p1=(10, 20) p2=(10, 50)\ntrue\nAria has 100 HP\nAria has 75 HP","ex":{"2":"Declares <code>struct Point</code> with immutable fields <code>x</code> and <code>y</code>.","4":"Creates a point <code>p1</code> at (10, 20).","5":"<code>p1.with(y: 50)</code> produces a new point with <code>y</code> changed, leaving <code>p1</code> untouched.","6":"Prints coordinates of <code>p1</code> and <code>p2</code>.","7":"Structs have value equality: <code>p1 == Point(x: 10, y: 20)</code> evaluates to <code>true</code>.","10":"Declares <code>class Hero</code>.","11":"Field <code>name</code>.","12":"Field <code>health</code> with default 100.","14":"<code>init</code> constructor initializes the hero with a name.","18":"Method <code>takeDamage</code> updates <code>self.health</code>.","22":"Method <code>status</code> formats and returns the hero's current HP.","27":"Creates hero Aria.","28":"Prints initial status.","29":"Hero takes 25 damage.","30":"Prints updated status showing 75 HP."}}]],"quiz":[{"q":"What is the key difference between a struct and a class?","o":["A struct is an immutable value type; a class is a stateful blueprint with methods","Structs cannot have fields","Classes cannot have methods"],"a":0,"why":"Structs represent immutable data records; classes represent objects with identity, methods, and mutable state."},{"q":"What does `self` mean inside a class method?","o":["The specific instance of the object being acted on","The entire file","The operating system"],"a":0,"why":"`self` refers to the current object instance."},{"q":"How do you produce a modified copy of a struct `p`?","o":["p.with(field: newValue)","p.copy(field: newValue)","p.update()"],"a":0,"why":"`.with(field: value)` creates a copy with specified fields updated."}]},{"title":"Pattern matching with match","desc":"When you have many possibilities to check, <code>match</code> is much cleaner and safer than long chains of if/else. It evaluates a value and picks the first pattern that matches.","blocks":[["p","Patterns can match literal values (<code>200</code>), ranges (<code>500..=599</code>), or use the wildcard <code>_</code> to handle any other case. <code>match</code> is also an expression, so you can return it directly!"],["s",{"f":"12_match","code":"fn describeHttp(code: Int) -> String {\n  return match code {\n    200 => \"OK: Success\"\n    404 => \"Not Found\"\n    500..=599 => \"Server Error\"\n    _ => f\"Other status: {code}\"\n  }\n}\n\nprint(describeHttp(200))\nprint(describeHttp(404))\nprint(describeHttp(503))\nprint(describeHttp(418))","out":"OK: Success\nNot Found\nServer Error\nOther status: 418","ex":{"1":"Function taking an HTTP code and returning a description.","2":"<code>return match code</code> begins pattern matching.","3":"Matches exact value 200: returns <code>\"OK: Success\"</code>.","4":"Matches exact value 404: returns <code>\"Not Found\"</code>.","5":"Matches any number in range 500..=599: returns <code>\"Server Error\"</code>.","6":"<code>_</code> matches anything else.","10":"Tests 200: prints OK: Success.","11":"Tests 404: prints Not Found.","12":"Tests 503: prints Server Error.","13":"Tests 418: matches wildcard and prints Other status: 418."}}]],"quiz":[{"q":"What does `_ =>` represent in a match expression?","o":["The catch-all pattern for anything else","An empty value","A syntax error"],"a":0,"why":"The underscore `_` is the wildcard pattern matching all remaining cases."},{"q":"What does `500..=599 =>` match?","o":["Any number from 500 up to and including 599","Only 500 and 599","Numbers greater than 599"],"a":0,"why":"`500..=599` is an inclusive range pattern matching every number in that span."},{"q":"Can `match` be used as an expression that returns a value?","o":["Yes, match is an expression in Mycel","No, it can only print","Only inside a class"],"a":0,"why":"`match` evaluates directly to the value of the matching arm."}]},{"title":"Errors and how to read them","desc":"Every programmer runs into errors! Mycel is designed to be friendly: its compiler diagnostics point directly to the line, explain <b>why</b>, and provide a <b>fix</b>.","blocks":[["p","When code might fail at run time, Mycel uses <code>Result<T, Error></code>. A Result is a sealed parcel that holds either <code>Ok(value)</code> or <code>Err(Error(\"reason\"))</code>. You unpack it safely using <code>match</code>."],["s",{"f":"13_errors","code":"// A function that might fail returns Result<Int, Error>\nfn parseAge(text: String) -> Result<Int, Error> {\n  if text.isEmpty {\n    return Err(Error(\"age cannot be empty\"))\n  }\n  let age = text.toInt()\n  if age == nil {\n    return Err(Error(f\"'{text}' is not a valid number\"))\n  }\n  if age < 0 {\n    return Err(Error(\"age cannot be negative\"))\n  }\n  return Ok(age)\n}\n\nfn check(input: String) {\n  match parseAge(input) {\n    .Ok(age) => print(f\"Valid age: {age}\")\n    .Err(e) => print(f\"Error: {e.message}\")\n  }\n}\n\ncheck(\"25\")\ncheck(\"\")\ncheck(\"abc\")\ncheck(\"-5\")","out":"Valid age: 25\nError: age cannot be empty\nError: 'abc' is not a valid number\nError: age cannot be negative","ex":{"2":"Function returning <code>Result<Int, Error></code>.","3":"If string is empty, returns an <code>Err</code> with an error message.","6":"<code>text.toInt()</code> parses text to an Int, returning <code>nil</code> on failure.","7":"If parsing failed, returns an <code>Err</code>.","10":"If age is negative, returns an <code>Err</code>.","13":"If all validations pass, returns <code>Ok(age)</code>.","16":"Helper function to test input.","17":"<code>match parseAge(input)</code> safely handles both outcomes.","18":"Unpacks <code>.Ok(age)</code> on success.","19":"Unpacks <code>.Err(e)</code> and prints the error message.","23":"Tests valid age \"25\".","24":"Tests empty string.","25":"Tests non-numeric string \"abc\".","26":"Tests negative number \"-5\"."}}]],"quiz":[{"q":"What are the two variants in a `Result`?","o":["Ok(value) and Err(error)","Yes and No","True and False"],"a":0,"why":"A Result is either `Ok(value)` on success or `Err(error)` on failure."},{"q":"What does Mycel's compiler provide when an error happens?","o":["Error code, visual squiggles, 'why' explanation, and 'fix' suggestion","Just a silent exit","Only a line number"],"a":0,"why":"Mycel diagnostics include error codes, source spans with pointers, clear explanations, and fix-it suggestions."},{"q":"If you bring a habit from Python like typing `def`, what happens?","o":["Mycel explains that `def` is Python and suggests `fn`","It silently runs","The program panics at runtime"],"a":0,"why":"Mycel's habit system detects syntax from other languages and gives clear translation guidance."}]},{"title":"Working with files (std.fs)","desc":"Programs need to persist data across runs. Mycel's standard library includes <code>std.fs</code> for file operations. For security, programs cannot touch files unless you grant permission with <code>--allow-read</code> and <code>--allow-write</code>.","blocks":[["p","• <code>fs.writeText(path, text)</code>: writes text to a file.<br>• <code>fs.readText(path)</code>: reads a file, returning <code>Result<String, Error></code>.<br>• <code>fs.remove(path)</code>: deletes a file."],["s",{"f":"14_files","code":"import std.fs\n\nfile = \"data.txt\"\n\n// Write text to a file\nfs.writeText(file, \"Hello from Mycel files!\\nLine 2\")\n\n// Read text back\nmatch fs.readText(file) {\n  .Ok(content) => {\n    print(\"Read successfully:\")\n    print(content)\n  }\n  .Err(e) => print(f\"Error: {e.message}\")\n}\n\n// Clean up\nfs.remove(file)\nprint(\"Cleaned up file.\")","out":"Read successfully:\nHello from Mycel files!\nLine 2\nCleaned up file.","ex":{"1":"<code>import std.fs</code> brings in file system functions.","3":"Filename variable.","6":"<code>fs.writeText</code> writes content into the file.","9":"<code>fs.readText</code> reads the file, returning a Result.","10":"Handles <code>.Ok(content)</code> when reading succeeds.","14":"Handles <code>.Err(e)</code> if reading fails.","18":"<code>fs.remove(file)</code> cleans up the temporary file.","19":"Prints confirmation."}}]],"quiz":[{"q":"Which module is used for reading and writing files?","o":["std.fs","std.file","std.io"],"a":0,"why":"`std.fs` contains file system utilities like writeText, readText, and remove."},{"q":"What does `fs.readText(path)` return?","o":["Result<String, Error>","String directly","Bool"],"a":0,"why":"`fs.readText` returns a `Result` so your code can gracefully handle missing files or denied access."},{"q":"Why are permission flags required for file access?","o":["To ensure programs only access files you explicitly authorize","To make disk access faster","It is required by the compiler"],"a":0,"why":"Mycel's capability model protects your computer by denying OS access unless granted."}]},{"title":"Building for the web (std.web)","desc":"With <code>std.web</code>, creating web apps, APIs, and microservices takes just a few lines of readable code — just like Flask, Express, or Sinatra!","blocks":[["p","• Create an app: <code>app = web.App()</code><br>• Define routes: <code>app.get(\"/path\", handler)</code> and <code>app.post(...)</code><br>• URL parameters: <code>/greet/:name</code> captures <code>req.params[\"name\"]</code><br>• Responses: <code>web.html(...)</code>, <code>web.text(...)</code>, <code>web.json(...)</code><br>• Serve live: <code>app.run(8000)</code>"],["s",{"f":"15_web","code":"import std.web\nimport std.http\n\nfn mockReq(method: String, path: String) -> http.Request {\n  return http.Request(method: method, path: path, query: {}, headers: {}, body: \"\")\n}\n\n// 1. Create a web application\napp = web.App()\n\n// 2. Define routes\napp.get(\"/\", req => web.html(\"<h1>Welcome to Mycel!</h1>\"))\napp.get(\"/greet/:name\", req => {\n  let name = req.params.get(\"name\", \"friend\")\n  return web.text(f\"Hello, {name}!\")\n})\napp.get(\"/api/status\", req => web.json({\"status\": \"online\", \"users\": 42}))\n\n// 3. Test our routes (in real apps, call: app.run(8000))\nr1 = app.handle(mockReq(\"GET\", \"/\"))\nprint(f\"[{r1.status}] {r1.body}\")\n\nr2 = app.handle(mockReq(\"GET\", \"/greet/Ada\"))\nprint(f\"[{r2.status}] {r2.body}\")\n\nr3 = app.handle(mockReq(\"GET\", \"/api/status\"))\nprint(f\"[{r3.status}] {r3.body}\")","out":"[200] <h1>Welcome to Mycel!</h1>\n[200] Hello, Ada!\n[200] {\"status\":\"online\",\"users\":42}","ex":{"1":"<code>import std.web</code> brings in web server utilities.","2":"<code>import std.http</code> brings in HTTP request/response types.","4":"Helper function creating mock HTTP requests for testing.","9":"<code>app = web.App()</code> initializes the web application.","12":"Defines a GET route for <code>\"/\"</code> returning HTML.","13":"Defines route <code>\"/greet/:name\"</code> with path parameter <code>:name</code>.","17":"Defines route <code>\"/api/status\"</code> returning JSON.","20":"Tests the home route using <code>app.handle</code>.","21":"Prints status and HTML body.","23":"Tests the parameterized greet route.","24":"Prints response greeting.","26":"Tests the API route.","27":"Prints JSON output."}}]],"quiz":[{"q":"How do you capture a path parameter in `std.web`?","o":["With a colon: /greet/:name","With braces: /greet/{name}","With a dollar sign: /greet/$name"],"a":0,"why":"Path parameters start with a colon, like `:name`, and are available in `req.params`."},{"q":"How do you return a JSON response?","o":["web.json(data)","web.send(data)","json.encode(data)"],"a":0,"why":"`web.json(...)` automatically encodes data to JSON with the correct application/json headers."},{"q":"How do you start serving the web app live on port 8000?","o":["app.run(8000)","app.start()","web.listen(8000)"],"a":0,"why":"`app.run(port)` runs the server on that port until stopped."}]},{"title":"Final project: Report card","desc":"Putting it all together! You now know variables, f-strings, lists, comprehensions, structs, functions, and pattern matching. Here is a complete program that analyzes class grades, calculates student averages, assigns letter grades, and finds honor roll students.","blocks":[["p","Read through the complete code below. Every single line uses concepts you learned in this course!"],["s",{"f":"16_project","code":"struct Student {\n  let name: String, scores: [Int]\n}\n\nfn average(scores: [Int]) -> Float {\n  if scores.isEmpty { return 0.0 }\n  var total = 0\n  for s in scores { total += s }\n  return total / scores.length\n}\n\nfn letterGrade(avg: Float) -> String {\n  return match avg.toInt() {\n    90..=100 => \"A\"\n    80..=89 => \"B\"\n    70..=79 => \"C\"\n    _ => \"Keep practicing\"\n  }\n}\n\nstudents = [\n  Student(name: \"Ada\", scores: [95, 92, 98]),\n  Student(name: \"Alan\", scores: [82, 88, 85]),\n  Student(name: \"Grace\", scores: [78, 84, 80]),\n]\n\nprint(\"=== Class Report Card ===\")\nfor student in students {\n  avg = average(student.scores)\n  grade = letterGrade(avg)\n  print(f\"{student.name}: avg={avg:.1f} ({grade})\")\n}\n\nhonor_roll = [s.name for s in students if average(s.scores) >= 85.0]\nprint(f\"Honor Roll: {honor_roll}\")","out":"=== Class Report Card ===\nAda: avg=95.0 (A)\nAlan: avg=85.0 (B)\nGrace: avg=80.7 (B)\nHonor Roll: [\"Ada\", \"Alan\"]","ex":{"1":"<code>struct Student</code> packages a student's name and score list together.","5":"<code>fn average(scores)</code> calculates the mean score as a Float.","6":"Guard for empty scores list.","7":"Accumulates total with a loop.","9":"<code>total / scores.length</code> produces a Float division in Mycel.","12":"<code>fn letterGrade(avg)</code> uses match to map numeric averages to letter grades.","13":"Matches integer average against score bands.","21":"Initializes a list of three <code>Student</code> records.","27":"Prints header.","28":"Loops over each student in the list.","29":"Calculates average score.","30":"Determines letter grade.","31":"Uses f-string formatting <code>{avg:.1f}</code> to print with 1 decimal place.","34":"List comprehension filters for students with average >= 85.0.","35":"Prints honor roll list."}}]],"quiz":[{"q":"What language construct created the honor roll in one line?","o":["List comprehension","A while loop","An SQL query"],"a":0,"why":"`[s.name for s in students if average(s.scores) >= 85.0]` is a list comprehension."},{"q":"What does `{avg:.1f}` do in the print statement?","o":["Formats the float to 1 decimal place","Divides avg by 1","Rounds avg to an Int"],"a":0,"why":"The `:.1f` format specifier formats the number with one digit after the decimal point."},{"q":"Why is `struct Student` helpful in this program?","o":["It groups related data (name and scores) into a clean, typed unit","It speeds up arithmetic","It is required for printing"],"a":0,"why":"Structs provide structured, type-safe data modeling."}]}],"G":[["Program","A sequence of instructions that a computer executes step by step."],["Mycel (.myc / .olx)","A friendly, statically typed programming language that compiles to sandboxed JavaScript."],["Terminal","The text window where commands like `mycel run file.myc` are typed and run."],["print()","Function that outputs text and values to the terminal screen."],["Comment (//)","Text ignored by the computer, written as notes for people."],["String","Text enclosed in double quotes, e.g. \"hello world\"."],["Int","Whole numbers without fractions, e.g. 42, -7."],["Float","Numbers with a decimal point, e.g. 3.14, 0.5."],["Bool","A boolean value: either true or false."],["Variable","A named storage location holding a value, created with `x = 1`."],["let","Declares an immutable variable whose value cannot be reassigned."],["var","Declares a mutable variable whose value can change."],["f-string","Formatted string literal `f\"hello {name}\"` that interpolates expressions."],["List","An ordered collection of items enclosed in square brackets `[1, 2, 3]`."],["Comprehension","A concise syntax to transform or filter lists: `[x * 2 for x in xs if x > 1]`."],["if / else","Conditional branching to execute different code based on boolean logic."],["Loop","A repeating code block: `for item in list` or `while condition`."],["Range (.. and ..=)","A sequence of numbers, e.g. `0..3` (exclusive) or `1..=5` (inclusive)."],["Function (fn)","A reusable named block of code declared with `fn name(args) { ... }`."],["Arrow Function (=>)","A concise single-expression function: `fn double(x) => x * 2`."],["Map","A collection of key-value associations: `{\"key\": value}`."],["Set","An unordered collection of unique values: `Set([1, 2, 3])`."],["Struct","An immutable value type that groups named fields."],["Class","A blueprint for objects that combine state and methods."],["self","A reference to the active object instance within a class method."],["match","A pattern matching expression that routes a value to the first matching branch."],["Result<T, Error>","An envelope type holding either `Ok(value)` or `Err(error)`."],["std.fs","Standard library module for reading, writing, and managing files."],["std.web","Standard library framework for routing HTTP requests and building web apps."]]};
const D = DATA.L;
const G = DATA.G;
const KEY = "learn-mycel-progress-v1";
const THEME_KEY = "mycel-theme-choice";
const N = D.length + 1;

let st = { done: {}, cur: 0 };
try {
  st = Object.assign(st, JSON.parse(localStorage.getItem(KEY) || "{}"));
} catch (e) {}

// Theme management
function initTheme() {
  const saved = localStorage.getItem(THEME_KEY);
  if (saved) {
    document.documentElement.setAttribute("data-theme", saved);
  } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches) {
    document.documentElement.setAttribute("data-theme", "light");
  } else {
    document.documentElement.setAttribute("data-theme", "dark");
  }
}
initTheme();

document.getElementById("theme-toggle").onclick = () => {
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
};

const save = () => {
  try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {}
};

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function updateSidebar() {
  const completed = Object.keys(st.done).length;
  const pct = Math.round((completed / D.length) * 100);
  document.getElementById("bar").style.width = pct + "%";
  document.getElementById("prog-pct").textContent = pct + "%";
  document.getElementById("prog-count").textContent = completed + " / " + D.length + " done";

  let listHtml = D.map((l, i) => {
    const isCur = i === st.cur ? "cur" : "";
    const isDone = st.done[i] ? "✓" : "";
    return `<a class="${isCur}" data-i="${i}"><span class="k">${isDone}</span>${i + 1}. ${l.title}</a>`;
  }).join("");

  const isGlossCur = st.cur === D.length ? "cur" : "";
  listHtml += `<a class="${isGlossCur}" data-i="${D.length}"><span class="k"></span>📖 Glossary</a>`;
  document.getElementById("list").innerHTML = listHtml;
}

function sampleHtml(s) {
  const lines = s.code.split("\n");
  const linesHtml = lines.map((l, i) => {
    const ln = i + 1;
    const hasExp = s.ex && s.ex[ln];
    return `<div class="ln ${hasExp ? "x" : ""}" data-n="${ln}"><b>${ln}</b>${esc(l) || " "}</div>`;
  }).join("");

  return `<div class="lbl">Code · samples/${s.f}.myc · click any line to inspect</div>
<div class="code">${linesHtml}</div>
<div class="exp">Click any line of code to see what it means.</div>
<div class="lbl">What the computer really printed (<code>mycel run samples/${s.f}.myc</code>)</div>
<pre class="out">${esc(s.out)}</pre>`;
}

function show(i) {
  st.cur = i;
  save();
  const m = document.getElementById("main");

  if (i === D.length) {
    // Glossary view
    let gHtml = `<h2>📖 Glossary of Mycel Concepts</h2>
<p class="lead">A quick reference for the core ideas, symbols, and keywords used across the course.</p>
<dl>`;
    for (const [term, def] of G) {
      gHtml += `<dt>${esc(term)}</dt><dd>${esc(def)}</dd>`;
    }
    gHtml += `</dl>
<div class="nav2">
  <button class="g" id="prev">← Back to Course</button>
  <button id="restart-btn" class="g">Restart from Lesson 1</button>
</div>`;
    m.innerHTML = gHtml;
    document.getElementById("prev").onclick = () => show(i - 1);
    document.getElementById("restart-btn").onclick = () => show(0);
    updateSidebar();
    window.scrollTo(0, 0);
    return;
  }

  const l = D[i];
  let blocksHtml = "";
  for (const b of l.blocks) {
    if (b[0] === "p") {
      blocksHtml += `<p>${b[1]}</p>`;
    } else if (b[0] === "pre") {
      blocksHtml += `<pre>${esc(b[1])}</pre>`;
    } else if (b[0] === "s") {
      blocksHtml += `<div class="smp" data-f="${b[1].f}">${sampleHtml(b[1])}</div>`;
    }
  }

  let quizHtml = "";
  if (l.quiz && l.quiz.length) {
    quizHtml = `<div class="quiz">
  <div class="quiz-title">✏️ Quick Check (${l.quiz.length} question${l.quiz.length > 1 ? "s" : ""})</div>`;
    l.quiz.forEach((q, qi) => {
      quizHtml += `<div class="q" data-q="${qi}">
  <div class="q-text">${qi + 1}. ${q.q}</div>
  <div class="opts">`;
      q.o.forEach((opt, oi) => {
        quizHtml += `<button data-o="${oi}">${esc(opt)}</button>`;
      });
      quizHtml += `</div><div class="fb"></div></div>`;
    });
    quizHtml += `</div>`;
  }

  const prevDisabled = i === 0 ? "disabled" : "";
  const nextLabel = i < D.length - 1 ? "Next Lesson →" : "View Glossary →";

  m.innerHTML = `<h2>${i + 1}. ${l.title}</h2>
<div class="lead">${l.desc}</div>
${blocksHtml}
${quizHtml}
<div class="nav2">
  <button class="g" id="prev" ${prevDisabled}>← Previous</button>
  <button id="next">${nextLabel}</button>
</div>`;

  // Sample click listeners
  m.querySelectorAll(".smp").forEach(e => {
    const sBlock = l.blocks.find(b => b[0] === "s" && b[1].f === e.dataset.f);
    if (!sBlock) return;
    const s = sBlock[1];
    e.onclick = ev => {
      const r = ev.target.closest(".ln.x");
      if (!r) return;
      e.querySelectorAll(".ln").forEach(x => x.classList.remove("sel"));
      r.classList.add("sel");
      const expBox = e.querySelector(".exp");
      expBox.classList.add("on");
      expBox.innerHTML = `<b>Line ${r.dataset.n}:</b> ${s.ex[r.dataset.n]}`;
    };
  });

  // Quiz click listeners
  const ansMap = {};
  m.querySelectorAll(".q").forEach(qe => {
    const qIndex = +qe.dataset.q;
    const qObj = l.quiz[qIndex];
    qe.onclick = ev => {
      const b = ev.target.closest("button");
      if (!b || b.disabled) return;
      const chosen = +b.dataset.o;
      const fb = qe.querySelector(".fb");

      if (chosen === qObj.a) {
        b.className = "ok";
        fb.className = "fb ok";
        fb.innerHTML = "<b>✓ Correct!</b> " + (qObj.why ? esc(qObj.why) : "");
        qe.querySelectorAll("button").forEach(btn => btn.disabled = true);
        ansMap[qIndex] = true;

        if (Object.keys(ansMap).length === l.quiz.length) {
          st.done[i] = 1;
          save();
          updateSidebar();
        }
      } else {
        b.className = "bad";
        b.disabled = true;
        fb.className = "fb bad";
        fb.textContent = "Not quite, try another option!";
      }
    };
  });

  document.getElementById("prev").onclick = () => show(i - 1);
  document.getElementById("next").onclick = () => show(i + 1);

  updateSidebar();
  window.scrollTo(0, 0);
}

document.getElementById("list").onclick = e => {
  const a = e.target.closest("a");
  if (a && a.dataset.i !== undefined) {
    show(+a.dataset.i);
  }
};

document.getElementById("reset").onclick = () => {
  if (confirm("Reset all course progress?")) {
    st = { done: {}, cur: 0 };
    save();
    show(0);
  }
};

show(Math.min(st.cur || 0, N - 1));
</script>
</body>
</html>
